services:
  backend-app:
    build:
      context: .
      dockerfile: dockerfile
    container_name: nicatto-beard-backend
    restart: unless-stopped
    environment:
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: root
      DB_PASS: teste
      DB_NAME: teste
      NODE_ENV: development
      JWT_SECRET: uma_chave_bem_grande_aqui_acesso
      JWT_EXPIRES_IN: 15m
      FRONTEND_URL: http://localhost:8080
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: nicatto-beard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: teste
      POSTGRES_DB: teste
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d teste"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
